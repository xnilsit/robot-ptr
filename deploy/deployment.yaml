---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-ptr
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robot-ptr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robot-ptr
    spec:
      serviceAccountName: robot-ptr
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: robot-ptr
          image: ghcr.io/xnilsit/robot-ptr:0.0.0 # x-release-please-version
          args:
            - --leader-elect
            - --dry-run # remove once the logged changes look right
          envFrom:
            # ROBOT_USER and ROBOT_PASSWORD of a Robot webservice user
            - secretRef:
                name: robot-ptr-credentials
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
