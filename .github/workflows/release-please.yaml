---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Please

on:
  push:
    branches:
      - main
  # Catches vulnerabilities that are published or scored after their fix was
  # merged.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pull requests opened with GITHUB_TOKEN need approval before CI runs on
      # them, so release-please acts as a GitHub App instead.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
          experimental: true
          install_args: --locked go go:golang.org/x/vuln/cmd/govulncheck

      # A vulnerability with a CVSS score of 7.0 or more that the last release
      # calls and HEAD no longer does is released right away.
      - name: Check for security fixes
        id: security
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fixes=$(.mise/scripts/security-fixes.sh)
          if [[ -n "$fixes" ]]; then
            printf '### Security fixes since the last release\n\n```\n%s\n```\n' "$fixes" >> "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # Every commit type is listed in the changelog, but only these open a
      # release pull request. ci, chore, docs, ... wait for the next release.
      - name: Check for releasable commits
        id: releasable
        env:
          SECURITY_FIXES: ${{ steps.security.outputs.found }}
        run: |
          last=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || true)
          if [[ "$SECURITY_FIXES" == true ]] || git log --format=%B "${last:+$last..}HEAD" |
            grep -qE '^((feat|fix|perf|refactor|deps|revert)(\([^)]*\))?!?|[a-z]+(\([^)]*\))?!): |^BREAKING[ -]CHANGE: '; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable commits since ${last:-the first commit}, skipping the release pull request"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: ${{ steps.releasable.outputs.found != 'true' }}

      # Auto-merge waits for the required CI checks. The merge is pushed by the
      # GitHub App, which triggers this workflow again to tag the release.
      - name: Merge the release pull request
        if: ${{ steps.security.outputs.found == 'true' && steps.release.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" --json number --jq '.[0].number')
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash

  # The release image and chart are built from here, right after the release
  # is created, instead of on `release: published`.
  release:
    name: Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag-name }}
