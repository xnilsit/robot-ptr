---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_call:
    inputs:
      tag:
        description: Semver tag of the release, e.g. 1.2.3
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ inputs.tag == '' }}

permissions:
  contents: read

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      go-version: ${{ steps.versions.outputs.go-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
          experimental: true
          install: false

      - name: Resolve versions
        id: versions
        run: echo "go-version=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"

  image:
    name: Image
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    with:
      build-args: |
        VERSION=${{ inputs.tag || github.ref_name }}
        REVISION=${{ github.sha }}
        GO_VERSION=${{ needs.versions.outputs.go-version }}
      meta-images: ghcr.io/${{ github.repository }}
      # Releases get 1.2.3, 1.2, 1 and rolling; pushes to main get the branch tag.
      meta-tags: |
        type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
        type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
        type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' && !startsWith(inputs.tag, '0.') }}
        type=raw,value=rolling,enable=${{ inputs.tag != '' }}
        type=ref,event=branch,enable=${{ inputs.tag == '' }}
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The chart is only published for releases, after the image it points to.
  chart:
    name: Chart
    needs: image
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
      VERSION: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          experimental: true
          install_args: --locked cosign helm

      - name: Package chart
        run: |
          helm dependency build charts/robot-ptr
          helm package charts/robot-ptr --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Log in to GHCR
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"

      - name: Push and sign chart
        run: |
          helm push "dist/robot-ptr-$VERSION.tgz" "oci://$CHART_REPO" 2>&1 | tee push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -n1)
          cosign sign --yes "$CHART_REPO/robot-ptr@$digest"
